[project]
name = "arduino-mcp"
version = "0.1.0"
description = "Servidor MCP para interactuar con un Arduino Nano 33 BLE Sense por puerto serie"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "pyserial>=3.5",
]

[project.scripts]
arduino-mcp = "arduino_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arduino_mcp"]
